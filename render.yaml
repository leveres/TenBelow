services:
  - type: web
    name: tenbelow-backend
    env: node
    plan: starter
    rootDir: tenbelow-backend
    buildCommand: npm install && npm run prisma:generate
    startCommand: npm run start:production
    healthCheckPath: "/health"
    envVars:
      - key: BACKEND_URL
        sync: false
      - key: BACKEND_DATA_DIR
        value: /var/data
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: TenBelow <noreply@tenbelow.com>
      - key: DATABASE_URL
        sync: false
      - key: PG_READS
        value: "0"
      - key: PRISMA_SYNC
        value: "1"
      - key: PRISMA_BOOTSTRAP_SYNC
        value: "1"
      - key: S3_MEDIA_BUCKET
        sync: false
      - key: S3_MEDIA_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "true"
      - key: PUBLIC_MEDIA_BASE_URL
        sync: false
      - key: SELLER_SUBSCRIPTION_PRODUCT_ID
        value: com.innovativecodeworks.com.TenBelow.seller.monthly
    disks:
      - name: tenbelow-data
        mountPath: /var/data
        sizeGB: 1
