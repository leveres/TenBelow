services:
  - type: web
    name: tenbelow-backend
    env: node
    plan: starter
    rootDir: tenbelow-backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /config
    envVars:
      - key: BACKEND_URL
        sync: false
      - key: BACKEND_DATA_DIR
        value: /var/data
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: TenBelow <noreply@tenbelow.com>
      - key: SELLER_SUBSCRIPTION_PRODUCT_ID
        value: com.innovativecodeworks.com.TenBelow.seller.monthly
    disks:
      - name: tenbelow-data
        mountPath: /var/data
        sizeGB: 1
