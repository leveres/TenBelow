services:
  - type: web
    name: tenbelow-backend
    env: node
    plan: starter
    rootDir: tenbelow-backend
    buildCommand: npm install && npm run prisma:generate
    startCommand: npm run start:production
    healthCheckPath: "/health"
    envVars:
      - key: BACKEND_URL
        value: https://tenbelow.onrender.com
      - key: BACKEND_DATA_DIR
        value: /var/data
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: TenBelow <noreply@tenbelow.com>
      - key: DATABASE_URL
        sync: false
      - key: PG_READS
        value: "0"
      - key: PRISMA_SYNC
        value: "1"
      - key: PRISMA_BOOTSTRAP_SYNC
        value: "1"
      # Media Phase 1: disk only — files under /var/data/media/. Do not set S3_* or
      # PUBLIC_MEDIA_BASE_URL until full R2 cutover (see tenbelow-backend/docs/media-storage-setup.md).
      - key: SELLER_SUBSCRIPTION_PRODUCT_ID
        value: com.innovativecodeworks.com.TenBelow.seller.monthly
    disks:
      - name: tenbelow-data
        mountPath: /var/data
        sizeGB: 1
